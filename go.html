<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼핑 레이더 · 이동</title>
<style>
:root { --bg: #f6f5f2; --fg: #1c1d20; --muted: #6b6f76; --accent: #e8590c; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #111317; --fg: #eceef1; --muted: #a0a7b2; --accent: #ff8a3d; color-scheme: dark; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
       font: 15px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
       padding: 0 max(16px, env(safe-area-inset-left, 0px)); text-align: center; }
a { color: var(--accent); font-weight: 600; }
p { margin: 6px 0; }
.muted { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <p id="msg">원래 글로 이동하는 중…</p>
  <p id="link"></p>
  <p class="muted"><a href="./">쇼핑 레이더 열기</a></p>
</main>
<script>
// 카톡 알림의 '자세히 보기'용: 카카오에 등록 안 된 주소(네이버·백화점)는 이 페이지를 거쳐서 감
// (다른 사람에게 전달해도 카카오 안내 페이지로 빠지지 않게). 아래 주소만 허용.
var OK = ["naver.com", "naver.me", "ehyundai.com", "lotteshopping.com", "shinsegae.com", "ssg.com",
          "galleria.co.kr", "akplaza.com", "starfield.co.kr", "premiumoutlets.co.kr", "kakao.com"];
var u = new URLSearchParams(location.search).get("u") || "", host = "";
try { var p = new URL(u); host = p.protocol === "https:" || p.protocol === "http:" ? p.hostname : ""; } catch (e) {}
var allowed = host && OK.some(function (d) { return host === d || host.slice(-d.length - 1) === "." + d; });
if (allowed) {
  var a = document.createElement("a"); a.href = u; a.textContent = "바로 가기";
  document.getElementById("link").appendChild(a);
  location.replace(u);
} else {
  document.getElementById("msg").textContent = "열 수 없는 주소예요.";
}
</script>
</body>
</html>
